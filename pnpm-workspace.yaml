packages:
  - '.'

# pnpm >= 11 replaced onlyBuiltDependencies with allowBuilds; unlisted packages fail the install
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: false

minimumReleaseAge: 4320  # 3 days

# concurrently 10.0.5 pins shell-quote@1.9.0 exactly; force the fix for GHSA-pqg4-j6r4-53mv
overrides:
  'concurrently>shell-quote': ^1.11.0
