# Read by the CI security scan (osv-scanner looks next to the scanned pnpm-lock.yaml).
# Findings in build/test-only packages are warnings (see scripts/osv-triage.mjs), so entries here
# are only needed for packages that ship in the app, when an advisory doesn't apply to unhush.
# Each entry ignores one advisory until its date, after which the scan fails again; remove the
# entry once a fixed version is installable.
#
# Format:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "why it doesn't apply"
